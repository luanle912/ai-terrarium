<script id="sky-logic">
// Pure logic for the sky island (no DOM, no canvas). The page and tests/sky-logic.test.mjs both run this block.
(function(){

const LAWN=6,LAWN_BACK=2,WATERFALL_LEN=140,DECOR_TOP=24;

const outdoorSpots=(W,H)=>[{id:'east-front',x:W+1,y:H-4,w:4,h:3},{id:'south-left',x:5,y:H+1,w:4,h:3},{id:'east-back',x:W+1,y:2,w:4,h:4}];

function buildIsland({W,H,lawn=LAWN,back=LAWN_BACK}){
  const cx=W/2,cy=H/2,x0=-back-3,x1=W+lawn+3,y0=-back-3,y1=H+lawn+3;
  const cells=new Set();
  // A squircle around the office with a few long, low waves: bays and headlands, never one-tile bumps.
  // Its half-width differs per side, so the lawn is wide in front of the office and thin behind the walls.
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const dx=x+0.5-cx,dy=y+0.5-cy,px=dx/(dx<0?W/2+back:W/2+lawn),py=dy/(dy<0?H/2+back:H/2+lawn);
    const a=Math.atan2(py,px),n=Math.pow(px**4+py**4,0.25);
    // +0.05 keeps the deepest bay from eating into the 6-tile lawn at the middle of a side.
    const wave=0.05+0.07*Math.sin(a*2+0.6)+0.05*Math.sin(a*3+2.1)+0.03*Math.sin(a*5+4.0);
    if(n<=1+wave||(x>=-1&&x<=W&&y>=-1&&y<=H))cells.add(key(x,y));
  }
  const count=(x,y)=>N4.filter(([a,b])=>cells.has(key(x+a,y+b))).length;
  const pos=k=>k.split(',').map(Number);
  const shore=new Map(),queue=[];
  for(const k of cells){const[x,y]=pos(k);if(count(x,y)<4){shore.set(k,0);queue.push([x,y]);}}
  for(let i=0;i<queue.length;i++){const[x,y]=queue[i],d=shore.get(key(x,y));for(const[a,b]of N4){const k=key(x+a,y+b);if(cells.has(k)&&!shore.has(k)){shore.set(k,d+1);queue.push([x+a,y+b]);}}}
  const list=[...cells].map(k=>{const[x,y]=pos(k),s=shore.get(k);return{x,y,shore:s,d:8+Math.pow(Math.min(s,11),1.55)*6+Math.floor(hash(x,y,1)*5)};})
    .sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.x-b.x);
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const c of list){minX=Math.min(minX,c.x);maxX=Math.max(maxX,c.x+1);minY=Math.min(minY,c.y);maxY=Math.max(maxY,c.y+1);}
  const spots=outdoorSpots(W,H);
  const inSpot=(x,y)=>spots.some(s=>x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h);
  const nearOffice=(x,y)=>x>=-1&&x<=W&&y>=-1&&y<=H;
  // The waterfall pours out of a small pond on the east shore; agents bathe at two of its cells.
  const east=list.filter(c=>!cells.has(key(c.x+1,c.y))).sort((a,b)=>b.y-a.y);
  const fall=east[Math.min(2,east.length-1)];
  const pond=new Set();
  for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=0;dx++){const x=fall.x+dx,y=fall.y+dy;if(cells.has(key(x,y))&&!nearOffice(x,y)&&!inSpot(x,y))pond.add(key(x,y));}

// ---- walking outside the office ----
// The only way between the raised office floor and the lawn: two steps on the pantry's east edge.
const stairs=(W,H)=>({x:W,y:7,h:2});
const inRect=(x,y,W,H)=>x>=0&&x<W&&y>=0&&y<H;
function canCross(a,b,W,H,st){
  const inA=inRect(a[0],a[1],W,H),inB=inRect(b[0],b[1],W,H);
  if(inA===inB)return true;
  const[o,l]=inA?[a,b]:[b,a];
  return o[0]===W-1&&l[0]===W&&o[1]===l[1]&&l[1]>=st.y&&l[1]<st.y+st.h;

function lawnWalk(island,W,H){
  const out=new Set(),blocked=new Set(island.decor.filter(d=>d.kind!=='flower').map(d=>key(d.x,d.y))),bath=new Set(island.pond.spots.map(s=>key(s.x,s.y)));

}

  if(inRect(x,y,W,H))return floorZ;
  if(x>=W&&x<W+STAIR_RUN&&y>=st.y&&y<st.y+st.h)return floorZ*(1-(x-W)/STAIR_RUN);
  return 0;
}

// FH is the height the view is fitted to: the island top plus a little underside; the rest may run off the bottom.
const FOCUS_UNDER=40;
function sceneFrame(island,{W,H,TW,TH,WALL,pad}){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,topY=-Infinity;
  const take=(x,y,z)=>{const sx=(x-y)*TW,sy=(x+y)*TH-z;minX=Math.min(minX,sx);maxX=Math.max(maxX,sx);minY=Math.min(minY,sy);maxY=Math.max(maxY,sy);return sy;};

}

// ---- weather ----
const WEATHERS=['clear','cloudy','rain','storm','snow','fog'];
const WEIGHTS={clear:45,cloudy:25,rain:12,storm:5,snow:5,fog:8};
// How strongly each weather drives each effect, 0..1. Blending these is what makes transitions smooth.
const FX={
  clear:{cloud:0.2,rain:0,snow:0,storm:0,fog:0},
  cloudy:{cloud:0.8,rain:0,snow:0,storm:0,fog:0},
  rain:{cloud:0.9,rain:1,snow:0,storm:0,fog:0},
  storm:{cloud:1,rain:1,snow:0,storm:1,fog:0},
  snow:{cloud:0.7,rain:0,snow:1,storm:0,fog:0},
  fog:{cloud:0.5,rain:0,snow:0,storm:0,fog:1}
};
const WINTER=new Set([11,0,1]);
const MIN=60_000;

function pickNextWeather(prev,month,rand){
  const w={...WEIGHTS};

  if(!Number.isInteger(code))return null;
  if(code===0||code===1)return'clear';
  if(code===2||code===3)return'cloudy';
  if(code===45||code===48)return'fog';
  if((code>=51&&code<=67)||(code>=80&&code<=82))return'rain';
  if((code>=71&&code<=77)||code===85||code===86)return'snow';
  if(code>=95&&code<=99)return'storm';
  return null;

const initialWeather=(type,now)=>({fromFx:{...FX[type]},to:type,t0:now,dur:0,nextAt:now+20*MIN});
function weatherFx(state,now){
  const p=state.dur>0?(now-state.t0)/state.dur:1;

const lightningDelayMs=r=>8000+r*12000;

const flashLevel=(now,start,ms)=>now<start||now>=start+ms?0:(1-(now-start)/ms)**2;

const PREVIEW_MS=60_000;
const startPreview=(wx,preview,type,now)=>({wx:startTransition(wx,type,now,3000),preview:{until:now+PREVIEW_MS,back:preview?preview.back:wx.to}});

function loadWeatherSettings(storage){

    const raw=storage&&storage.getItem(WEATHER_KEY);
    if(!raw)return fallback;
    const v=JSON.parse(raw)||{};
    return{mode:MODES.includes(v.mode)?v.mode:'random',city:typeof v.city==='string'?v.city:''};
  }catch(e){return fallback;}
}
function saveWeatherSettings(storage,settings){
  try{storage.setItem(WEATHER_KEY,JSON.stringify({mode:settings.mode,city:settings.city}));return true;}catch(e){return false;}
}
const geocodeUrl=city=>'https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city.trim())+'&count=1&language=vi&format=json';
const forecastUrl=(lat,lon)=>'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=weather_code';
// Never rejects: every failure comes back as a reason the settings panel can show as-is.
async function fetchRealWeather(city,fetchFn,{timeoutMs=15000}={}){
  const name=(city||'').trim(),unreadable={ok:false,reason:'Dữ liệu thời tiết không đọc được'};
  if(!name)return{ok:false,reason:'Chưa nhập thành phố'};
  // A stalled connection (VPN black hole, captive portal) must still end in a reason and the Random fallback.
  const timed=p=>new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('hết thời gian chờ')),timeoutMs);Promise.resolve(p).then(v=>{clearTimeout(t);resolve(v);},e=>{clearTimeout(t);reject(e);});});
  const getJson=async url=>{const res=await timed(fetchFn(url));if(!res.ok)throw new Error('HTTP '+res.status);try{return{body:await timed(res.json())};}catch(e){if(e&&e.message==='hết thời gian chờ')throw e;return{body:undefined};}};
  try{
    const geo=(await getJson(geocodeUrl(name))).body;
    if(geo===undefined)return unreadable;
    const place=geo&&Array.isArray(geo.results)&&geo.results[0];
    if(!place||!Number.isFinite(place.latitude)||!Number.isFinite(place.longitude))return{ok:false,reason:'Không tìm thấy thành phố "'+name+'"'};
    const now=(await getJson(forecastUrl(place.latitude,place.longitude))).body;
    const code=now&&now.current&&now.current.weather_code,type=wmoToWeather(code);
    if(!type)return unreadable;
    return{ok:true,type,code,place:place.name||name};
  }catch(e){return{ok:false,reason:'Không lấy được thời tiết: '+(e&&e.message?e.message:String(e))};}
}

// ---- sky colours ----
const hexRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgbHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mixHex=(a,b,p)=>{const A=hexRgb(a),B=hexRgb(b);return rgbHex(A.map((v,i)=>v*(1-p)+B[i]*p));};
const SKY_DAY={zenith:'#2f6fd6',horizon:'#cfe9ff',haze:'#e6f3ff',below:'#bcd9f2',cloud:'#ffffff',cloudShade:'#dfe8f2'};
const SKY_NIGHT={zenith:'#070b1c',horizon:'#1c2747',haze:'#26335a',below:'#0e1630',cloud:'#3a4466',cloudShade:'#2c3554'};
const SKY_WARM={zenith:'#4a5fa8',horizon:'#ffb27a',haze:'#ffd1a1',below:'#c99ab0',cloud:'#ffe0c4',cloudShade:'#e8b8a0'};
const GREY_DAY='#8e9aab',GREY_NIGHT='#2a2f3d';
// df is the day factor (0 night .. 1 day). Warmth peaks halfway through dawn and dusk; cloud cover and storms grey it all.
function skyColors(df,hour,fx){
  const warm=4*df*(1-df),grey=Math.max(0,fx.cloud-0.2)/0.8*0.55+fx.storm*0.3,greyTone=mixHex(GREY_NIGHT,GREY_DAY,df),out={};
  for(const k in SKY_DAY){
    let c=mixHex(SKY_NIGHT[k],SKY_DAY[k],df);
    c=mixHex(c,SKY_WARM[k],warm*(k==='zenith'?0.35:0.7));
    c=mixHex(c,greyTone,Math.min(0.85,grey*(k==='cloud'||k==='cloudShade'?0.6:1)));
    if(fx.storm>0)c=mixHex(c,'#2a2f3a',fx.storm*0.45);
    if(fx.fog>0&&(k==='horizon'||k==='haze'||k==='below'))c=mixHex(c,mixHex(greyTone,'#ffffff',0.4),fx.fog*0.5);
    out[k]=c;
  }
  return out;
}

globalThis.SkyLogic={stairs,canCross,lawnWalk,groundZ,STAIR_RUN,flashLevel,PREVIEW_MS,startPreview,stepPreview,LAWN_BACK,mixHex,skyColors,WEATHER_KEY,loadWeatherSettings,saveWeatherSettings,geocodeUrl,forecastUrl,fetchRealWeather,LAWN,WATERFALL_LEN,DECOR_TOP,outdoorSpots,buildIsland,sceneFrame,
  WEATHERS,WEIGHTS,FX,pickNextWeather,changeDelayMs,transitionMs,wmoToWeather,initialWeather,weatherFx,startTransition,stepRandom,snowCover,lightningDelayMs,lightningFlashMs};
})();

<script id="sky-render">
// Drawing for the sky island: the island itself (pre-rendered once per resolution), trees and the waterfall.
(function(){
'use strict';
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,p)=>{const A=hex(a),B=hex(b);return toHex(A.map((v,i)=>v*(1-p)+B[i]*p));};

// Night pulls every island colour toward the same deep blue the office uses after dark.
const night=(c,df)=>mix(c,'#0d1322',(1-df)*0.6);
const SNOW='#eef3f7';
// Depth bands of the underside: [from z, to z, colour], top to bottom.
const BANDS=[[0,-6,'#8a5a36'],[-6,-26,'#6f4a32'],[-26,-60,'#7a7a84'],[-60,-1e9,'#5f6070']];
// The pond's water surface sits this far below the grass.
const WATER_Z=-3;

function drawTree(ctx,P,d,df,snow){
  const[px,py]=P(d.x+0.5,d.y+0.5,0),x=Math.round(px),y=Math.round(py);
  const leaf=night(mix('#3e9a45',SNOW,snow*0.5),df),top=night(mix('#57b85a',SNOW,snow*0.6),df);

  ctx.fillStyle=leaf;ctx.fillRect(x-5,y-19,10,9);ctx.fillStyle=mix(leaf,'#000000',0.18);ctx.fillRect(x+1,y-19,4,9);
  ctx.fillStyle=top;ctx.fillRect(x-3,y-22,6,3);
}

// The island as one image the size of the scene canvas; only trees behind the walls are baked in,
// trees in front are drawn with the office so desks and walls overlap them correctly.
function renderIsland(island,frame,k,env){
  const {LW,LH,OX,OY}=frame,TW=16,TH=8,df=env.df,snow=env.snow;
  const cv=document.createElement('canvas');cv.width=Math.round(LW*k);cv.height=Math.round(LH*k);
  const ctx=cv.getContext('2d');ctx.setTransform(k,0,0,k,0,0);
  const P=(x,y,z=0)=>[OX+(x-y)*TW,OY+(x+y)*TH-z];
  const poly=(pts,c)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=c;ctx.fill();};
  const dep=(x,y)=>island.depth.get(x+','+y)||0,has=(x,y)=>island.cells.has(x+','+y),inPond=(x,y)=>island.pond.cells.has(x+','+y);

    const{x,y,d}=c,jit=(hash(x,y,3)-0.5)*14;

    }
    if(inPond(x,y)){
      // The pond is sunk WATER_Z below the grass: the far banks show as earth walls, the water fills the hollow.
      if(!inPond(x-1,y))poly([P(x,y,0),P(x,y+1,0),P(x,y+1,WATER_Z),P(x,y,WATER_Z)],night('#6f4a32',df));

      poly([P(x,y,WATER_Z),P(x+1,y,WATER_Z),P(x+1,y+1,WATER_Z),P(x,y+1,WATER_Z)],night(mix(inPond(x-1,y)&&inPond(x,y-1)?'#3f96d4':'#4aa3df',SNOW,snow*0.6),df));
    }else{
      const grass=(x+y)%2?'#62b14e':'#58a645';
      poly([P(x,y,0),P(x+1,y,0),P(x+1,y+1,0),P(x,y+1,0)],night(mix(grass,SNOW,snow*0.85),df));
    }
    if(!has(x,y+1))poly([P(x,y+1,0),P(x+1,y+1,0),P(x+1,y+1,-2),P(x,y+1,-2)],night(mix('#3f7f33',SNOW,snow*0.7),df));
    if(!has(x+1,y))poly([P(x+1,y,0),P(x+1,y+1,0),P(x+1,y+1,-2),P(x+1,y,-2)],night(mix('#356c2b',SNOW,snow*0.7),df));
  }
  // A ring of rim stones around the pond, open only where the water spills over the shore into the waterfall.
  {const f=island.waterfall,R=0.13,stones=[];
    for(const k of island.pond.cells){const[x,y]=k.split(',').map(Number);
      if(!inPond(x-1,y))stones.push([x-R,y,R*2,1]);
      if(!inPond(x,y-1))stones.push([x,y-R,1,R*2]);
      if(!inPond(x+1,y)&&!(x===f.x&&y===f.y))stones.push([x+1-R,y,R*2,1]);
      if(!inPond(x,y+1))stones.push([x,y+1-R,1,R*2]);}

  ctx.fillStyle=night('#3f7f33',df);

    const[px,py]=P(d.x+0.5,d.y+0.5,0),x=Math.round(px),y=Math.round(py);

}

// Slow glints moving over the pond surface (drawn every frame over the baked island).
function drawPond(ctx,island,P,t,df){
  for(const k of island.pond.cells){const[x,y]=k.split(',').map(Number);
    for(let j=0;j<2;j++){const p=(t*0.25+hash(x,y,7+j))%1,[gx,gy]=P(x+0.2+hash(x,y,9+j)*0.6,y+0.2+p*0.6,WATER_Z);ctx.globalAlpha=(0.25+0.45*df)*Math.sin(p*Math.PI);ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(gx),Math.round(gy),2,1);}
  }
  ctx.globalAlpha=1;
}

// The waterfall is a sheet of water lying in the plane of the island's east cliff face (x = const), so it slants with
// the cliff instead of being a flat screen-space strip: it pours over the pond's lip, runs down the face, then falls on.
function drawWaterfall(ctx,island,P,t,len,df){
  const f=island.waterfall,X=f.x+1,y0=f.y+0.15,y1=f.y+0.85,top=WATER_Z,bot=-(island.depth.get(f.x+','+f.y)||40)-len;
  const quad=(ya,yb,za,zb)=>{const a=P(X,ya,za),b=P(X,yb,za),c=P(X,yb,zb),d=P(X,ya,zb);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fill();};
  const ty=P(X,y0,top)[1],by=P(X,y0,bot)[1];
  // colours follow the island's light, so the fall does not glow at night
  const g=ctx.createLinearGradient(0,ty,0,by);g.addColorStop(0,rgba(night('#6eb9f5',df),0.95));g.addColorStop(0.6,rgba(night('#96cdfa',df),0.75));g.addColorStop(1,rgba(night('#dceeff',df),0));
  ctx.fillStyle=g;quad(y0,y1,top,bot);

  ctx.fillStyle=rgba(night('#3c82c8',df),0.35);quad(y0,y0+0.07,top,bot*0.7);quad(y1-0.07,y1,top,bot*0.7);
  for(let i=0;i<9;i++){const ya=y0+0.06+(y1-y0-0.16)*((i*0.37)%1),p=(t*0.55+i*0.11)%1,za=top-(top-bot)*p;ctx.fillStyle=rgba(night('#ffffff',df),0.75*(1-p));quad(ya,ya+0.05,za,za-14);}
  // foam where the pond spills over the lip
  ctx.fillStyle=rgba(night('#ffffff',df),0.6+0.3*df);quad(y0-0.05,y1+0.05,top+0.8,top-1.6);
}

// ---- sky behind the island and weather in front of it (both drawn in CSS px over the whole stage) ----
const rgba=(hexc,a)=>{const[r,g,b]=hex(hexc);return'rgba('+r+','+g+','+b+','+a+')';};
// A flat block cloud: lit top slab, shaded underside, optional smaller cap.
function slab(ctx,x,y,w,hgt,top,side,cap){
  ctx.fillStyle=top;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.max(1,Math.round(hgt)));
  ctx.fillStyle=side;ctx.fillRect(Math.round(x),Math.round(y+hgt),Math.round(w),Math.max(1,Math.round(hgt*0.45)));
  if(cap){ctx.fillStyle=top;ctx.fillRect(Math.round(x+w*0.25),Math.round(y-hgt*0.6),Math.round(w*0.45),Math.max(1,Math.round(hgt*0.6)));}
}
// One row of clouds at depth d (0 far at the horizon .. 1 near): far rows are small, hazy and slow.
function cloudRow(ctx,w,y,d,t,seed,count,col,S,speedK){
  const s=(0.25+d*1.3)*S,top=mix(col.cloud,col.haze,(1-d)*0.7),side=mix(col.cloudShade,col.haze,(1-d)*0.7),span=w+260*S;
  for(let i=0;i<count;i++){
    const cw=(34+hash(i,seed,1)*70)*s,x=((hash(i,seed,2)*span+t*4*s*speedK)%span)-130*S;
    slab(ctx,x,y,cw,5*s,top,side,hash(i,seed,3)>0.45);
  }
}
function farIsland(ctx,x,y,sc,col){
  const top=mix('#58a645',col.haze,0.72),under=mix('#6f707c',col.haze,0.78);
  ctx.fillStyle=under;ctx.beginPath();ctx.moveTo(x-22*sc,y);ctx.lineTo(x+22*sc,y);ctx.lineTo(x+6*sc,y+20*sc);ctx.lineTo(x-2*sc,y+30*sc);ctx.lineTo(x-10*sc,y+16*sc);ctx.closePath();ctx.fill();
  ctx.fillStyle=top;ctx.beginPath();ctx.moveTo(x-22*sc,y);ctx.lineTo(x,y-7*sc);ctx.lineTo(x+22*sc,y);ctx.lineTo(x,y+7*sc);ctx.closePath();ctx.fill();
}
// env: {df, hour, fx:{cloud,rain,snow,storm,fog}, col: SkyLogic.skyColors(...), reduced}
function drawBack(ctx,w,h,t,env){
  const{df,hour,fx,col}=env,hy=h*0.5,S=Math.max(0.6,h/800),speedK=env.reduced?0.5:1;
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,col.zenith);g.addColorStop(0.46,col.horizon);g.addColorStop(0.5,col.haze);g.addColorStop(1,col.below);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  // Lightning lights up the sky behind the island only, brightest high up, never the office or the whole view.
  if(env.flash>0){const lg=ctx.createLinearGradient(0,0,0,hy);lg.addColorStop(0,'rgba(235,240,255,'+(0.3*env.flash)+')');lg.addColorStop(1,'rgba(235,240,255,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,w,hy);}
  if(df<0.95){// stars and moon
    const a=(1-df)*(1-fx.cloud*0.85);
    for(let i=0;i<140;i++){const tw=0.55+0.45*Math.sin(t*(env.reduced?0.5:1.6)+i*1.7);ctx.globalAlpha=a*tw;ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(hash(i,1,6)*w),Math.round(hash(i,2,6)*hy*0.92),i%9?1:2,i%9?1:2);}
    ctx.globalAlpha=(1-df)*(1-fx.cloud*0.6);const mx=w*0.8,my=h*0.15,r=11*S;
    ctx.fillStyle='#f3f0d0';ctx.beginPath();ctx.arc(mx,my,r,0,7);ctx.fill();ctx.fillStyle=col.zenith;ctx.beginPath();ctx.arc(mx+r*0.45,my-r*0.3,r*0.92,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  if(df>0.05){// sun arcs across the sky with the hour
    const p=Math.max(0,Math.min(1,(hour-6)/12)),sx=w*(0.12+0.76*p),sy=hy*(0.9-0.75*Math.sin(Math.PI*p)),a=df*(1-fx.cloud*0.75);
    const sg=ctx.createRadialGradient(sx,sy,2,sx,sy,80*S);sg.addColorStop(0,'rgba(255,248,215,'+(0.85*a)+')');sg.addColorStop(1,'rgba(255,248,215,0)');ctx.fillStyle=sg;ctx.fillRect(sx-80*S,sy-80*S,160*S,160*S);
    ctx.globalAlpha=a;ctx.fillStyle='#fffbe0';ctx.beginPath();ctx.arc(sx,sy,9*S,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  const extra=Math.round(fx.cloud*6);
  for(let r=0;r<3;r++){const d=r/3;cloudRow(ctx,w,hy*(0.18+d*0.62),d*0.5,t,10+r*17,3+extra,col,S*0.8,speedK);}
  [[0.07,0.97,0.8],[0.24,1.01,0.55],[0.78,0.98,0.7],[0.93,1.02,0.45]].forEach(([fx_,fy,sc],i)=>farIsland(ctx,w*fx_,hy*fy+Math.sin(t*0.4+i)*1.5*S,sc*S,col));
  const hb=ctx.createLinearGradient(0,hy-18*S,0,hy+18*S);hb.addColorStop(0,rgba(col.haze,0));hb.addColorStop(0.5,rgba(col.haze,0.9));hb.addColorStop(1,rgba(col.haze,0));ctx.fillStyle=hb;ctx.fillRect(0,hy-18*S,w,36*S);
  for(let r=0;r<9;r++){const d=(r+1)/9;cloudRow(ctx,w,hy+4*S+(h-hy)*d*d,d,t,100+r*29,6+extra,col,S,speedK);}
  if(df>0.3&&fx.rain<0.3)for(let i=0;i<3;i++){const bx=((t*9*speedK+i*16)%(w+60))-30,by=hy*0.5+i*5*S+Math.sin(t*2+i)*2,f=Math.floor(t*5+i)%2;ctx.fillStyle=rgba('#35507a',df);ctx.fillRect(bx,by,1,1);ctx.fillRect(bx-2,by-f,2,1);ctx.fillRect(bx+1,by-f,2,1);}
}
// env adds flash (0..1, already 0 when reduced motion is on)
function drawFront(ctx,w,h,t,env){
  const{fx,col}=env,S=Math.max(0.6,h/800),many=env.reduced?0.4:1;
  const span=w+500*S,nx=((t*22*(env.reduced?0.5:1))%span)-250*S;slab(ctx,nx,h*0.84,190*S,11*S,rgba(col.cloud,0.85),rgba(col.cloudShade,0.85),true);
  const nRain=Math.round(260*fx.rain*many);

    box(x+0.4,y+0.44,0.34,0.36,0.5,4.5+br,a.shirt);
    const bl=shade(a.shirt,-50)===a.shirt?'#5b8def':['#3e8ed0','#e5484d','#46a758','#8e4ec6'][a.id%4];
    box(x+0.6,y+0.4,0.62,0.44,0.5,4+br*0.6,bl);
    [0.75,0.92,1.09].forEach(k=>poly([P(x+k,y+0.4,4+br*0.6),P(x+k+0.05,y+0.4,4+br*0.6),P(x+k+0.05,y+0.84,4+br*0.6),P(x+k,y+0.84,4+br*0.6)],shade(bl,40),null));
    box(x+1.2,y+0.5,0.08,0.1,0.5,2,'#141414');box(x+1.2,y+0.66,0.08,0.1,0.5,2,'#141414');
  }

  hit(e){
    const r=e.currentTarget.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*LW,ly=(e.clientY-r.top)/r.height*LH;
    let best=null,bd=1e9;
    for(const a of this.agents){const[sx,sy]=a.sleeping?P(a.x,a.y,-4):PA(a.x,a.y);const hw=a.sleeping?14:7;if(lx>sx-hw&&lx<sx+hw&&ly>sy-(a.sleeping?10:24)&&ly<sy+(a.sleeping?8:3)){const d=Math.abs(lx-sx)+Math.abs(ly-sy+10);if(d<bd){bd=d;best=a;}}}
    return best;
  }
  bubbleText(a){
    const t=a.target&&this.byId(a.target);
    switch(a.status){
      case 'working':return a.tool[0]+' '+a.tool[1];
      case 'thinking':return 'thinking…';
      case 'permission':return 'cần duyệt: '+a.msg;
      case 'error':return 'lỗi: '+a.msg;
      case 'talking':return '→ '+(t?t.name:'?')+': '+a.msg;
      case 'waiting':return a.waitSub?'chờ sub-agent '+(t?t.name:''):'chờ '+(t?t.name:'?');
      case 'done':return 'xong task ✓';
      case 'entering':return a.parent?'sub-agent vào ca':'session mới';
      case 'idle':return (a.actNow==='bath'?'💦 ':'☕ ')+(ACT_TXT[a.actNow]||'ra pantry giải lao');
      case 'leaving':return 'rời đi…';
      default:return null;
    }
  }

  render(){
    const{sel,paused,live,dataSource,endpoint,showBubbles,autoApprove,agentCount,speed,showSettings}=this.state;
    const isLive=dataSource==='live',isSim=!isLive,ls=live;
    const cnt=k=>this.agents.filter(a=>!a.leaving&&k.includes(a.status)).length;
    const seasonInfo=window.SeasonTree&&this.treeOn?window.SeasonTree.SEASONS[this.seasonKey]:null;
    const summary=[['Đang gõ',['working'],'#3e8ed0'],['Suy nghĩ',['thinking'],'#5b8def'],['Trao đổi / chờ',['talking','waiting'],'#12a594'],['Chờ duyệt',['permission'],'#f5a524'],['Lỗi',['error'],'#e5484d'],['Idle / xong',['idle','done'],'#8b8fa3'],['Sub-agent',null,'#ffd166']]
      .map(([label,ks,color])=>({label,color,n:ks?cnt(ks):this.agents.filter(a=>a.parent&&!a.leaving).length}));
    const deptList=[...this.depts.values()].map(Dp=>({label:Dp.key,short:Dp.label,color:Dp.color,n:this.agents.filter(a=>a.dept===Dp.key&&!a.leaving).length})).filter(d=>d.n>0);
    const s=sel&&this.byId(sel);
    const par=s&&s.parent&&this.byId(s.parent);
    const selDept=s?this.depts.get(s.dept):null;
    const selData=s?{name:s.name,short:s.short,sid:s.sid,color:s.shirt,statusLabel:(ST[s.status]||ST.working)[0],statusColor:(ST[s.status]||ST.working)[1],
      activity:this.bubbleText(s)||'—',cwd:s.cwd,model:s.model,tokens:fmtK(s.tokens),role:par?'Sub-agent của '+par.short:'Main session',
      dept:s.dept,deptColor:selDept?selDept.color:'#8b8fa3',
      canApprove:!isLive&&s.status==='permission',hist:(s.liveHist||s.hist).slice(0,7)}:null;
    const srcLabel=isLive?(ls==='ok'?'LIVE · ~/.claude':ls==='error'?'LIVE · mất kết nối':'LIVE · đang kết nối'):'MÔ PHỎNG';
    const srcColor=isLive?(ls==='ok'?'#46a758':ls==='error'?'#e5484d':'#f5a524'):'#ffd166';
    const bubbles=this.agents.filter(a=>!a.gone).map(a=>{
      const txt=(showBubbles||sel===a.id||['permission','error'].includes(a.status))?this.bubbleText(a):null;
      if(!txt)return null;
      const[sx,sy]=this.headPos(a),c=(ST[a.status]||ST.working)[1];
      return h('div',{key:a.id,ref:el=>{if(el)this.bubbleEls[a.id]=el;else delete this.bubbleEls[a.id];},
        style:{position:'absolute',left:Math.min(92,Math.max(8,sx/LW*100))+'%',top:((sy-12)/LH*100)+'%',transform:'translate(-50%,-100%)',display:'flex',alignItems:'center',gap:5,padding:'3px 6px',background:'#ffffff',color:'#14161c',border:'2px solid '+c,boxShadow:'2px 2px 0 rgba(0,0,0,0.35)',font:"500 10px/1.2 'JetBrains Mono',monospace",whiteSpace:'nowrap',maxWidth:240,overflow:'hidden',textOverflow:'ellipsis'}},
        h('b',{style:{color:c,fontFamily:"'Pixelify Sans',monospace",fontSize:11}},a.name),
        h('span',{style:{overflow:'hidden',textOverflow:'ellipsis'}},txt));
    });

    const pad={paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'};

    const hdrCtl={padding:'4px 10px',fontSize:11};

    return h('div',{className:'app',style:{display:'flex',flexDirection:'column',gap:8,paddingTop:12,paddingBottom:12,boxSizing:'border-box',overflow:'hidden',background:'var(--bg)',...pad}},

      h('header',{style:{display:'flex',flexWrap:'wrap',alignItems:'center',gap:'8px 16px'}},
        h('div',{title:'Mỗi nhân viên là một Claude session đang chạy trên máy bạn',style:{display:'flex',alignItems:'baseline',gap:8,flex:'none'}},
          h('div',{style:{fontFamily:"'Pixelify Sans',monospace",fontSize:20,fontWeight:700,letterSpacing:'0.02em',color:'#ffffff'}},'CLAUDE CO.'),
          this.serverVersion&&h('span',{style:{fontSize:10,color:'var(--muted)',fontFamily:"'JetBrains Mono',monospace",opacity:0.6}},'v'+this.serverVersion)
        ),
        h('div',{style:{display:'flex',flexWrap:'wrap',gap:6,fontSize:11,alignItems:'center',flex:'1 1 360px',minWidth:0}},
          seasonInfo&&h('div',{className:'chip',style:{borderColor:seasonInfo.accent,gap:6}},
            h('span',{style:{width:8,height:8,borderRadius:'50%',background:seasonInfo.accent,display:'inline-block',boxShadow:'0 0 4px '+seasonInfo.accent}}),
            h('span',{style:{color:seasonInfo.accent,fontWeight:600}},seasonInfo.label)
          ),
          summary.map((c,i)=>h('div',{key:i,className:'chip'},
            h('span',{style:{width:8,height:8,background:c.color,display:'inline-block'}}),
            h('span',null,c.label),
            h('strong',{style:{color:'#ffffff'}},c.n)
          ))
        ),
        h('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'center',gap:8,flex:'none'}},
          h('div',{style:{display:'flex',alignItems:'center',gap:8,border:'2px solid var(--border)',background:'var(--surface)',...hdrCtl}},
            h('span',{style:{width:8,height:8,background:srcColor,display:'inline-block'}}),
            h('span',{style:{color:'var(--fg)',fontWeight:600}},srcLabel)
          ),
          h('button',{className:'btn',style:hdrCtl,onClick:()=>this.setState(p=>({paused:!p.paused}))},paused?'▶ Tiếp tục':'❚❚ Tạm dừng'),
          isSim&&h('button',{className:'btn btn-accent',style:hdrCtl,onClick:()=>{const a=this.addAgent({});if(a)this.setState({sel:a.id});}},
            '+ Session')
        )
      ),

      deptList.length>0&&h('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'center',gap:6,fontSize:11}},
        h('span',{style:{fontSize:10,color:'#5d6578'}},'PHÒNG BAN'),
        deptList.map((d,i)=>h('div',{key:i,style:{display:'flex',alignItems:'center',gap:6,padding:'2px 8px 2px 2px',background:'var(--surface)',border:'1px solid #232a39'}},
          h('span',{style:{padding:'1px 5px',background:d.color,color:'#ffffff',fontFamily:"'Pixelify Sans',monospace",fontWeight:600,fontSize:11}},d.short),
          h('span',{style:{color:'#c9cfdc',whiteSpace:'nowrap'}},d.label),
          h('strong',{style:{color:'#ffffff'}},d.n)
        ))
      ),

      isLive&&ls==='error'&&h('div',{style:{display:'flex',flexDirection:'column',gap:8,padding:'14px 16px',border:'2px solid #e5484d',background:'#2a1418',fontSize:12,lineHeight:1.6,color:'#ffd7d9'}},
        h('strong',{style:{color:'#ffffff',fontSize:13}},'Claude Office needs a local server'),
        h('span',null,'This page visualizes your Claude Code sessions. To connect, run on your machine:'),
        h('code',{style:{display:'block',background:'var(--bg)',padding:'8px 10px',color:'#ffd166',fontSize:11,whiteSpace:'pre-wrap',userSelect:'all'}},'npx claude-office@latest\n# or: node claude-office-server.js'),
        h('span',{style:{color:'var(--muted)'}},'Server reads ~/.claude/projects and streams session state via SSE to '+endpoint),
        h('span',{style:{color:'var(--muted)',fontSize:11}},'Tip: add ?server=host:port to this URL to change the endpoint')
      ),

      h('div',{ref:this.setStage,style:{position:'relative',flex:'1 1 0',minHeight:0,border:'3px solid #232a39',overflow:'hidden',containerType:'size',display:'flex',alignItems:'center',justifyContent:'center'}},
        h('canvas',{ref:this.setBack,style:{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:0,display:'block'}}),
        // The view is fitted to the island top (FH tall), not the whole scene: the deep underside may run off the bottom.
        h('div',{ref:this.setWrap,style:{position:'relative',alignSelf:'flex-start',width:'min(100cqw, calc(100cqh * '+LW+' / '+FH+'))',aspectRatio:LW+' / '+LH,marginTop:'calc((100cqh - min(100cqw * '+FH+' / '+LW+', 100cqh)) / 2)'}},
          h('canvas',{ref:this.setCanvas,width:LW,height:LH,onClick:this.onClick,onMouseMove:this.onMove,style:{position:'relative',zIndex:1,width:'100%',height:'auto',display:'block'}}),
          h('div',{style:{position:'absolute',inset:0,pointerEvents:'none',zIndex:3}},bubbles)
        ),
        h('canvas',{ref:this.setFront,style:{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:2,pointerEvents:'none',display:'block'}}),

        selData&&h('div',{style:{position:'absolute',zIndex:10,top:12,right:12,width:300,maxWidth:'calc(100% - 24px)',maxHeight:'calc(100% - 68px)',overflowY:'auto',boxSizing:'border-box',background:'var(--surface)',border:'3px solid var(--fg)',boxShadow:'6px 6px 0 rgba(0,0,0,0.45)',padding:14,display:'flex',flexDirection:'column',gap:12,fontSize:12}},
          h('div',{style:{display:'flex',alignItems:'center',gap:10}},
            h('div',{style:{width:34,height:34,background:selData.deptColor,color:'#ffffff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Pixelify Sans',monospace",fontSize:13,fontWeight:700,flex:'none'}},selData.short),
            h('div',{style:{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:2}},
              h('div',{style:{fontFamily:"'Pixelify Sans',monospace",fontSize:17,fontWeight:600,color:'#ffffff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},selData.name),
              h('div',{style:{fontSize:10,color:'var(--muted)'}},selData.sid)
            ),
            h('button',{className:'btn',onClick:()=>this.setState({sel:null}),style:{width:28,height:28,padding:0,flex:'none'}},'×')
          ),
          h('div',{style:{display:'flex',flexDirection:'column',gap:4,padding:10,background:'var(--bg)',borderLeft:'4px solid '+selData.statusColor}},
            h('span',{style:{fontWeight:600,color:selData.statusColor}},selData.statusLabel),
            h('span',{style:{color:'var(--fg)',wordBreak:'break-all'}},selData.activity)
          ),
          selData.canApprove&&h('div',{style:{display:'flex',gap:8}},
            h('button',{onClick:()=>{if(s){this.log(s,'Đã cho phép · '+s.msg);s.status='working';s.tool=[s.msg.split(':')[0],s.msg.split(':')[1]||''];s.until=Date.now()+3000/this.speed;this.forceUpdate();}},style:{flex:1,border:'2px solid #46a758',background:'#46a758',color:'#06140a',padding:9,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}},'Cho phép'),
            h('button',{className:'btn',onClick:()=>{if(s){this.log(s,'Bị từ chối · '+s.msg);s.status='error';s.msg='user từ chối';s.until=Date.now()+2000/this.speed;this.forceUpdate();}},style:{flex:1,padding:9}},'Từ chối')
          ),
          h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:'10px 14px'}},
            [['THƯ MỤC',selData.cwd],['MODEL',selData.model],['TOKENS',selData.tokens],['VAI TRÒ',selData.role]].map(([label,val],i)=>
              h('div',{key:i,style:{display:'flex',flexDirection:'column',gap:2,minWidth:0}},
                h('span',{style:{fontSize:10,color:'var(--muted)'}},label),
                h('span',{style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},val)
              )
            ),
            h('div',{key:'dept',style:{display:'flex',flexDirection:'column',gap:2,minWidth:0,gridColumn:'1 / -1'}},
              h('span',{style:{fontSize:10,color:'var(--muted)'}},'PHÒNG BAN (theo cwd)'),
              h('span',{style:{display:'flex',alignItems:'center',gap:6}},
                h('span',{style:{width:8,height:8,background:selData.deptColor,display:'inline-block'}}),
                selData.dept
              )
            )
          ),
          h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
            h('span',{style:{fontSize:10,color:'var(--muted)'}},'HOẠT ĐỘNG GẦN ĐÂY'),
            selData.hist.map((hh,i)=>h('div',{key:i,style:{display:'flex',gap:8,lineHeight:1.45}},
              h('span',{style:{color:'#5d6578',flex:'none'}},hh.t),
              h('span',{style:{color:'#c9cfdc',wordBreak:'break-word'}},hh.text)
            ))
          )
        ),

        h('button',{className:'settings-toggle','aria-label':'Cài đặt',title:'Cài đặt: nguồn dữ liệu, tốc độ, bubble text',onClick:()=>this.setState(p=>({showSettings:!p.showSettings}))},'⚙'),

        showSettings&&h('div',{className:'settings-panel'},
          h('div',{style:{fontFamily:"'Pixelify Sans',monospace",fontSize:14,fontWeight:600,color:'#ffffff',marginBottom:4}},'Cài đặt'),
          h('label',null,'Nguồn dữ liệu',
            h('select',{value:dataSource,onChange:e=>this.setState({dataSource:e.target.value})},
              h('option',{value:'sim'},'Mô phỏng'),
              h('option',{value:'live'},'Live (SSE)')
            )
          ),
          isLive&&h('label',null,'Endpoint',
            h('input',{type:'text',value:endpoint,onChange:e=>this.setState({endpoint:e.target.value})})
          ),
          isSim&&h('label',null,'Số agent: '+agentCount,
            h('input',{type:'range',min:1,max:16,value:agentCount,onChange:e=>this.setState({agentCount:+e.target.value})})
          ),
          h('label',null,'Tốc độ: '+speed.toFixed(2)+'x',
            h('input',{type:'range',min:0.5,max:3,step:0.25,value:speed,onChange:e=>this.setState({speed:+e.target.value})})
          ),
          h('label',null,'Bubble text',
            h('input',{type:'checkbox',checked:showBubbles,onChange:e=>this.setState({showBubbles:e.target.checked})})
          ),
          h('div',{style:{borderTop:'1px solid var(--border)',margin:'2px 0'}}),
          h('label',null,'Thời tiết',
            h('select',{'aria-label':'Chế độ thời tiết',value:this.state.weatherMode,onChange:e=>this.setWeather({weatherMode:e.target.value})},
              h('option',{value:'random'},'Ngẫu nhiên'),
              h('option',{value:'real'},'Thời tiết thật'),
              h('option',{value:'off'},'Tắt (luôn trời quang)')
            )
          ),
          this.state.weatherMode==='real'&&h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
            h('div',{style:{display:'flex',gap:6}},
              h('input',{type:'text','aria-label':'Thành phố',placeholder:'Thành phố, ví dụ Đà Lạt',value:this.state.cityDraft,style:{flex:1,maxWidth:'none'},
                onChange:e=>this.setState({cityDraft:e.target.value}),onKeyDown:e=>{if(e.key==='Enter')this.setWeather({city:this.state.cityDraft.trim()});}}),
              h('button',{className:'btn',style:{padding:'4px 8px',fontSize:11},onClick:()=>this.setWeather({city:this.state.cityDraft.trim()})},'Cập nhật')
            ),
            this.state.realStatus.text&&h('span',{role:'status',style:{fontSize:11,lineHeight:1.4,color:this.state.realStatus.state==='error'?'#ff9b9e':this.state.realStatus.state==='ok'?'#8fd69a':'var(--muted)'}},this.state.realStatus.text),
            h('span',{style:{fontSize:10,color:'var(--muted)',lineHeight:1.4}},'Tên thành phố được gửi tới Open-Meteo để lấy thời tiết.')
          ),
          h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
            h('span',null,'Hiện tại: '+WEATHER_LABEL[this.wx.to]),
            h('div',{style:{display:'flex',flexWrap:'wrap',gap:4}},
              WEATHER_PREVIEW.map(([type,label])=>h('button',{key:type,className:'btn',title:'Xem thử: '+WEATHER_LABEL[type],style:{padding:'3px 7px',fontSize:11},onClick:()=>this.previewWeather(type)},label))
            )
          ),
          isSim&&h('label',null,'Auto approve',
            h('input',{type:'checkbox',checked:autoApprove,onChange:e=>this.setState({autoApprove:e.target.checked})})
          )
        )
      )
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(h(ClaudeOffice));
</script>
