<title>Claude Office</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0e1117;--fg:#e6e9ef;--muted:#8b93a7;--border:#2a3142;--surface:#151a24;--accent:#7fb2ff;--warn:#ffd166;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased;margin:0}
a{color:var(--accent)}a:hover{color:#b8d4ff}
button{font-family:inherit}
*{box-sizing:border-box}
.btn{border:2px solid var(--border);background:var(--surface);color:var(--fg);padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.btn:hover{background:#1d2433}
.btn-active{background:var(--fg);color:var(--bg)}
.btn-accent{border-color:var(--warn);background:var(--warn);color:#1a1300;font-weight:600}
.btn-accent:hover{background:#ffe08f}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px;background:var(--surface);border:1px solid #232a39;color:#aab2c5;white-space:nowrap;flex:none;font-size:11px}
.settings-toggle{position:fixed;bottom:16px;right:max(16px,env(safe-area-inset-right,0px));z-index:100;width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.settings-toggle:hover{background:#1d2433}
.settings-panel{position:fixed;bottom:60px;right:max(16px,env(safe-area-inset-right,0px));z-index:100;width:280px;max-width:calc(100vw - 32px);background:var(--surface);border:2px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:12px;font-size:12px}
.settings-panel label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.settings-panel input[type=range]{flex:1;max-width:120px}
.settings-panel input[type=text]{flex:1;max-width:160px;background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:4px 8px;font-family:inherit;font-size:11px}
.settings-panel select{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:4px 8px;font-family:inherit;font-size:11px}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<div id="root"></div>
<script>
"use strict";
const h=React.createElement;

const W=16,H=13,TW=16,TH=8,WALL=56;
const LW=(W+H)*TW+32, LH=(W+H)*TH+WALL+30;
const OX=H*TW+16, OY=WALL+16;
const P=(x,y,z=0)=>[OX+(x-y)*TW, OY+(x+y)*TH-z];
const DESKS=[]; for(let r=0;r<3;r++)for(let c=0;c<4;c++)DESKS.push({gx:1+c*4,gy:1+r*4});
const BLOCK=new Set(); DESKS.forEach(d=>{BLOCK.add(d.gx+','+d.gy);BLOCK.add((d.gx+1)+','+d.gy);}); ['0,0','15,0','15,12','8,0'].forEach(k=>BLOCK.add(k));
const DOOR={tile:[0,12],pt:[-0.9,12.5]};

const THEMES={
  night:{label:'Night shift',bg:'#0b0e14',fa:'#1b2233',fb:'#1f2740',wl:'#262f48',wr:'#2e3856',trim:'#3d4970',glass:'#16294a',glassHi:'#2f5d9a',door:'#151a27',board:'#d9dee8',dt:'#7a5a40',dl:'#5c4330',dr:'#4a3626',mon:'#15161c',on:'#5ef2ff',off:'#262d3d',chair:'#3b4058',kb:'#2b2f3c',plant:'#3fa36b',pot:'#a5573b',stroke:null,shadow:'rgba(0,0,0,0.45)'},
  day:{label:'Sunny studio',bg:'#f4ead8',fa:'#d8b689',fb:'#d1ad7e',wl:'#f3e7d3',wr:'#eadbc2',trim:'#cdb796',glass:'#a9dbff',glassHi:'#e2f4ff',door:'#9a6b45',board:'#ffffff',dt:'#fbf7ee',dl:'#ddd2bf',dr:'#c9bca6',mon:'#3a3a46',on:'#8be0b4',off:'#55596a',chair:'#e07a5f',kb:'#cfc6b4',plant:'#4caf6a',pot:'#d0743c',stroke:null,shadow:'rgba(80,50,20,0.25)'},
  blueprint:{label:'Blueprint',bg:'#eef1f6',fa:'#ffffff',fb:'#f6f8fb',wl:'#e3e8f0',wr:'#d9e0eb',trim:'#b9c4d6',glass:'#ffffff',glassHi:'#ffffff',door:'#c9d3e3',board:'#ffffff',dt:'#ffffff',dl:'#e9edf4',dr:'#dde3ec',mon:'#ffffff',on:'#2f5bff',off:'#e3e8f0',chair:'#ffffff',kb:'#ffffff',plant:'#ffffff',pot:'#ffffff',stroke:'#7d8aa3',shadow:'rgba(47,91,255,0.15)'}
};
function dayFactor(){const d=new Date(),t=d.getHours()+d.getMinutes()/60;if(t<5)return 0;if(t<6.5)return(1-Math.cos((t-5)/1.5*Math.PI))/2;if(t<16.5)return 1;if(t<18)return(1+Math.cos((t-16.5)/1.5*Math.PI))/2;return 0;}
function lerpHex(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t),g=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t),bl=Math.round((pa&255)*(1-t)+(pb&255)*t);return'#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);}
function lerpTheme(f){const n=THEMES.night,d=THEMES.day,o={_day:f};for(const k in n){if(k==='label')o[k]=f>0.5?d[k]:n[k];else if(k==='stroke')o[k]=null;else if(k==='shadow'){const pa=n[k].match(/[\d.]+/g).map(Number),pb=d[k].match(/[\d.]+/g).map(Number);o[k]='rgba('+pa.map((v,i)=>{const r=v*(1-f)+pb[i]*f;return i<3?Math.round(r):Math.round(r*100)/100;}).join(',')+')'}else if(typeof n[k]==='string'&&n[k][0]==='#')o[k]=lerpHex(n[k],d[k],f);else o[k]=n[k];}return o;}
const SKIN=['#f2c9a0','#d9a273','#a86b45','#f5d7bd','#c68a5e'];
const HAIR=['#2b1d14','#5a3a22','#d9a441','#1a1a1a','#8a3b2a','#e8e2d6','#3c3c52'];
const SHIRT=['#e5484d','#3e8ed0','#46a758','#f5a524','#8e4ec6','#12a594','#e93d82','#5b5bd6','#ff8b3d','#2f9ab8','#9b7b4f','#6a7bd8'];
const PROJ=[['newera-web','WEB'],['api-gateway','API'],['mobile-app','MOB'],['data-pipeline','DAT'],['infra-tf','INF'],['docs-site','DOC'],['auth-service','AUT'],['billing','BIL'],['design-tokens','TOK'],['ml-eval','EVL'],['chat-bot','BOT'],['cli-tools','CLI']];
const TOOLS=[['Read','Header.tsx'],['Edit','routes.ts'],['Bash','npm test'],['Grep','useSession'],['Write','CHANGELOG.md'],['Bash','git diff'],['Glob','**/*.test.ts'],['WebFetch','docs.anthropic.com'],['TodoWrite','4 tasks'],['Edit','package.json'],['Bash','tsc --noEmit'],['Read','schema.prisma']];
const TALK=['hỏi schema API','chia sẻ types','thống nhất naming','nhờ review diff','báo lỗi build'];
const PERM=['Bash: rm -rf dist','Bash: git push','Write: .env','Bash: npm publish'];
const ERRS=['test failed (3)','ENOENT config.json','tsc: 2 errors','exit code 1'];
const ST={working:['Đang gõ phím','#3e8ed0'],thinking:['Suy nghĩ','#5b8def'],talking:['Trao đổi','#12a594'],waiting:['Đứng chờ','#8e4ec6'],permission:['Chờ duyệt','#f5a524'],error:['Lỗi','#e5484d'],idle:['Idle','#8b8fa3'],done:['Xong task','#46a758'],entering:['Vào ca','#8b8fa3'],leaving:['Rời đi','#8b8fa3']};
const ICON={
  permission:['..#..','..#..','..#..','.....','..#..'], error:['#...#','.#.#.','..#..','.#.#.','#...#'],
  done:['....#','...#.','#.#..','.#...','.....'], idle:['####.','..#..','.#...','####.','.....'],
  waiting:['#####','.###.','..#..','.###.','#####'], talking:['#####','#...#','#####','.#...','....#']
};
const shade=(hh,p)=>{if(!hh||hh[0]!=='#'||hh.length!==7)return hh;const n=parseInt(hh.slice(1),16),c=v=>Math.max(0,Math.min(255,v));return'#'+((1<<24)+(c((n>>16)+p)<<16)+(c(((n>>8)&255)+p)<<8)+c((n&255)+p)).toString(16).slice(1);};
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','·':'000000010000000'};
function text3(ctx,str,x,y,col){ctx.fillStyle=col;x=Math.round(x);y=Math.round(y);[...String(str).toUpperCase()].forEach((ch,i)=>{const f=FONT[ch];if(!f)return;for(let b=0;b<15;b++)if(f[b]==='1')ctx.fillRect(x+i*4+(b%3),y+Math.floor(b/3),1,1);});}
function wallText3(ctx,str,y0,z0,col,sy=0.055,sz=1){ctx.fillStyle=col;[...String(str).toUpperCase()].forEach((ch,ci)=>{const f=FONT[ch];if(!f)return;for(let b=0;b<15;b++)if(f[b]==='1'){const[sx2,sy2]=P(0,y0+(ci*4+(b%3))*sy,z0-Math.floor(b/3)*sz);ctx.fillRect(Math.round(sx2),Math.round(sy2),1,1);}});}
const PANTS=['#2d3142','#3b4a6b','#4a3b2f','#22303a','#5a5f73'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const clock=()=>new Date().toTimeString().slice(0,8);
const fmtK=n=>n>=1000?(n/1000).toFixed(1)+'k':String(n);
const shortOf=s=>(s||'???').replace(/[^a-z0-9]/gi,'').slice(0,3).toUpperCase()||'S';

function bfs(from,to){
  const key=p=>p[0]+','+p[1], ok=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!BLOCK.has(x+','+y);
  const prev=new Map([[key(from),null]]), q=[from];
  while(q.length){const c=q.shift(); if(c[0]===to[0]&&c[1]===to[1])break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[c[0]+dx,c[1]+dy],k=key(n); if(!prev.has(k)&&(ok(n[0],n[1])||(n[0]===to[0]&&n[1]===to[1]))){prev.set(k,c);q.push(n);}}
  }
  if(!prev.has(key(to)))return[];
  const out=[];let c=to;while(c&&key(c)!==key(from)){out.unshift(c);c=prev.get(key(c));}return out;
}

class ClaudeOffice extends React.Component{
  constructor(props){
    super(props);
    const params=new URLSearchParams(location.search);
    const srv=params.get('server')||'localhost:4317';
    const ep=srv.includes('/events')?srv:(srv.startsWith('http')?srv:('http://'+srv))+'/events';
    this.state={sel:null,paused:false,tick:0,live:'off',
      dataSource:'live',endpoint:ep,agentCount:6,speed:1,showBubbles:true,autoApprove:false,showSettings:false};
    this.agents=[];this.seq=0;this.bubbleEls={};this.usedLooks=0;this.last=0;
    this.setCanvas=el=>{this.canvas=el;};
    this.onClick=e=>{const a=this.hit(e);this.setState({sel:a?a.id:null});};
    this.onMove=e=>{e.currentTarget.style.cursor=this.hit(e)?'pointer':'default';};
  }

  componentDidMount(){
    this.startSource();
    this.simTimer=setInterval(()=>this.simTick(),250);
    this.uiTimer=setInterval(()=>{if(performance.now()-(this.lastFrame||0)>200)this.frame(performance.now());this.setState(s=>({tick:s.tick+1}));},300);
    this.last=performance.now();
    setTimeout(()=>this.frame(performance.now()),0);
    const loop=t=>{this.lastFrame=performance.now();this.frame(t);this.raf=requestAnimationFrame(loop);};
    this.raf=requestAnimationFrame(loop);
  }
  componentWillUnmount(){clearInterval(this.simTimer);clearInterval(this.uiTimer);cancelAnimationFrame(this.raf);this.es&&this.es.close();}
  componentDidUpdate(_,ps){
    if(ps.dataSource!==this.state.dataSource||ps.endpoint!==this.state.endpoint){this.startSource();return;}
    if(!this.isLive&&ps.agentCount!==this.state.agentCount){
      const n=this.state.agentCount, live=this.agents.filter(a=>!a.leaving&&!a.parent);
      for(let i=live.length;i<n;i++)this.addAgent({});
      live.slice(n).forEach(a=>this.leave(a));
    }
  }
  get isLive(){return this.state.dataSource==='live';}
  get speed(){return this.state.speed||1;}
  get theme(){const f=dayFactor();if(f<=0)return Object.assign({_day:0},THEMES.night);if(f>=1)return Object.assign({_day:1},THEMES.day);return lerpTheme(f);}

  startSource(){
    this.es&&this.es.close();this.es=null;this.agents=[];this.firstSnap=true;
    if(this.isLive){
      const url=this.state.endpoint||'http://localhost:4317/events';
      this.setState({live:'connecting',sel:null});
      try{
        const es=new EventSource(url);this.es=es;
        es.onopen=()=>this.setState({live:'ok'});
        es.onerror=()=>this.setState({live:'error'});
        es.onmessage=e=>{try{this.syncLive(JSON.parse(e.data));this.state.live!=='ok'&&this.setState({live:'ok'});}catch(err){}};
      }catch(e){this.setState({live:'error'});}
    }else{
      this.setState({live:'off',sel:null});
      const n=this.state.agentCount;for(let i=0;i<n;i++)this.addAgent({seated:true});
    }
  }

  freeDesk(){const used=new Set(this.agents.filter(a=>!a.parent).map(a=>a.desk));for(let i=0;i<12;i++)if(!used.has(i))return i;return -1;}
  addAgent({seated,parent,live}){
    const isSub=!!parent;
    const desk=isSub?parent.desk:this.freeDesk();if(desk<0)return null;
    const d=DESKS[desk],id=++this.seq,now=Date.now(),k=this.usedLooks++;
    const a={id,desk,parent:parent?parent.id:null,
      name:live?live.name:(isSub?parent.short.toLowerCase()+'-subagent':PROJ[desk][0]),
      short:live?shortOf(live.name):(isSub?parent.short.slice(0,2)+'·':PROJ[desk][1]),
      skin:SKIN[k%SKIN.length],hair:HAIR[(k*3)%HAIR.length],hs:k%4,acc:k%5===2?'glasses':k%5===4?'headset':null,pants:PANTS[k%PANTS.length],shirt:SHIRT[(desk*5+k)%SHIRT.length],
      sid:live?live.id:'sess_'+Math.random().toString(36).slice(2,10),
      model:live?(live.model||'—'):(Math.random()<0.6?'claude-sonnet':'claude-opus'),
      cwd:live?(live.cwd||'—'):'~/code/'+(isSub?parent.name:PROJ[desk][0]),
      status:(seated&&!isSub)?'working':'entering',tool:pick(TOOLS),msg:'',target:null,
      tokens:Math.floor(rnd(2000,40000)),hist:[],until:now+rnd(500,4000),
      jobs:isSub?Math.floor(rnd(2,5)):0,leaving:false,sleeping:false,
      x:(seated&&!isSub)?d.gx+1:DOOR.pt[0],y:(seated&&!isSub)?d.gy+1.45:DOOR.pt[1],path:[],goalKey:(seated&&!isSub)?'seat':null,moving:false,dirFront:true,seated:!isSub&&!!seated};
    this.agents.push(a);
    this.log(a,parent?'Sub-agent được spawn bởi '+parent.short:(seated?'Đang chạy':'Session mới khởi động'));
    return a;
  }
  log(a,text){a.hist.unshift({t:clock(),text});if(a.hist.length>7)a.hist.pop();}
  byId(id){return this.agents.find(a=>a.id===id);}
  leave(a){if(a.leaving)return;a.leaving=true;a.status='leaving';this.log(a,'Session kết thúc');}
  setWork(a){a.status='working';a.target=null;a.tool=pick(TOOLS);a.until=Date.now()+rnd(2500,6500)/this.speed;this.log(a,a.tool[0]+' · '+a.tool[1]);}

  simTick(){
    if(this.state.paused||this.isLive)return;
    const now=Date.now(),sp=this.speed;
    for(const a of [...this.agents]){
      if(a.leaving)continue;
      if(a.status==='working')a.tokens+=Math.floor(rnd(20,120));
      if(a.status==='entering'){if(a.seated)this.setWork(a);continue;}
      if(a.waitSub){const s=this.byId(a.waitSub);if(!s||s.leaving){a.waitSub=null;this.log(a,'Sub-agent trả kết quả');this.setWork(a);}continue;}
      if(now<a.until)continue;
      const s=a.status;
      if(s==='talking'||s==='waiting'){this.log(a,'Về bàn làm việc');this.setWork(a);continue;}
      if(s==='permission'){this.log(a,this.state.autoApprove?'Auto-approve':'Hết thời gian chờ duyệt');this.setWork(a);continue;}
      if(s==='error'){this.log(a,'Sửa lỗi, chạy lại');this.setWork(a);continue;}
      if(a.parent){
        if(s==='done'){this.leave(a);continue;}
        if(--a.jobs<=0){a.status='done';a.until=now+2200/sp;this.log(a,'Hoàn thành, báo cáo về '+(this.byId(a.parent)||{}).short);continue;}
      }
      const others=this.agents.filter(o=>o!==a&&!o.leaving&&o.status!=='entering');
      const r=Math.random();
      if(r<0.36)this.setWork(a);
      else if(r<0.48){a.status='thinking';a.until=now+rnd(2000,4000)/sp;}
      else if(r<0.61&&others.length&&!a.parent){const t=pick(others);a.status='talking';a.target=t.id;a.msg=pick(TALK);a.until=now+rnd(7000,10000)/sp;this.log(a,'Sang bàn '+t.short+' · '+a.msg);}
      else if(r<0.68&&others.length&&!a.parent){const t=pick(others);a.status='waiting';a.target=t.id;a.msg='đợi output của '+t.short;a.until=now+rnd(8000,12000)/sp;this.log(a,'Sang đợi '+t.short);}
      else if(r<0.75){a.status='permission';a.msg=pick(PERM);a.until=now+(this.state.autoApprove?2500:14000)/sp;this.log(a,'Xin quyền · '+a.msg);}
      else if(r<0.81){a.status='error';a.msg=pick(ERRS);a.until=now+2600/sp;this.log(a,'Lỗi · '+a.msg);}
      else if(r<0.87){a.status='idle';a.until=now+rnd(3000,6000)/sp;}
      else if(r<0.92){a.status='done';a.until=now+2500/sp;this.log(a,'Hoàn thành task');}
      else if(!a.parent&&this.agents.filter(o=>o.parent&&!o.leaving).length<3)this.spawnSub(a);
      else this.setWork(a);
    }
  }
  spawnSub(a){
    const sub=this.addAgent({parent:a});if(!sub)return this.setWork(a);
    a.status='waiting';a.target=sub.id;a.waitSub=sub.id;a.msg='chờ sub-agent '+sub.short;a.tool=['Task','spawn sub-agent'];
    this.log(a,'Task → spawn sub-agent');
  }

  syncLive(snap){if(snap.usage)this.usage=snap.usage;
    const list=((snap&&snap.sessions)||[]).slice().sort((a,b)=>(!a.parentId?0:1)-(!b.parentId?0:1));
    const seen=new Set();
    for(const s of list){
      seen.add(s.id);
      let a=this.agents.find(x=>x.sid===s.id&&!x.leaving);
      if(!a){if(this.agents.some(x=>x.sid===s.id&&x.leaving)){seen.add(s.id);continue;}
        let par=null;if(s.parentId){par=this.agents.find(x=>x.sid===s.parentId&&!x.leaving);}
        a=this.addAgent({seated:this.firstSnap&&!par,parent:par,live:s});if(!a)continue;
        if(this.firstSnap&&par){const d=DESKS[par.desk];a.x=d.gx+2.45;a.y=d.gy+0.55;a.moving=false;a.path=[];a.goalKey='sub'+a.parent+'-0';}
      }
      if(s.parentId){const p=this.agents.find(x=>x.sid===s.parentId);if(p){a.parent=p.id;if(a.desk!==p.desk){a.desk=p.desk;a.goalKey=null;}}}
      a.status=ST[s.status]?s.status:'working';a.tool=[s.tool||'',s.detail||''];a.msg=s.detail||'';
      a.tokens=s.tokens||0;a.model=s.model||a.model;a.cwd=s.cwd||a.cwd;a.name=s.name||a.name;
      a.liveHist=s.recent||null;
      const t=s.waitingOn&&this.agents.find(x=>x.sid===s.waitingOn);
      a.target=t?t.id:null;
      if(a.status==='talking'&&s.talkingTo){const tgt=this.agents.find(x=>!x.leaving&&(x.name===s.talkingTo||x.short===s.talkingTo||x.sid===s.talkingTo));if(tgt)a.target=tgt.id;}
      if(a.status==='waiting'&&!a.target)a.status='working';
      // Sub-agent done → đánh dấu thời điểm, leave sau 3s
      if(a.parent&&s.status==='done'){if(!a.doneAt)a.doneAt=Date.now();else if(Date.now()-a.doneAt>3000)this.leave(a);}else a.doneAt=0;
    }
    this.agents.forEach(a=>{if(!seen.has(a.sid))this.leave(a);});
    this.firstSnap=false;
  }

  goalFor(a){

            h('span',{style:{fontSize:10,color:'var(--muted)'}},'HOẠT ĐỘNG GẦN ĐÂY'),
            selData.hist.map((hh,i)=>h('div',{key:i,style:{display:'flex',gap:8,lineHeight:1.45}},
              h('span',{style:{color:'#5d6578',flex:'none'}},hh.t),
              h('span',{style:{color:'#c9cfdc',wordBreak:'break-word'}},hh.text)
            ))
          )
        )
      ),

      // Footer
      h('div',{style:{fontSize:11,color:'#5d6578'}},'Click vào nhân viên để xem chi tiết session · Bánh răng ⚙ để đổi nguồn dữ liệu (mô phỏng / live)'),

      // Settings toggle
      h('button',{className:'settings-toggle',onClick:()=>this.setState(p=>({showSettings:!p.showSettings}))},'⚙'),

      // Settings panel
      showSettings&&h('div',{className:'settings-panel'},
        h('div',{style:{fontFamily:"'Pixelify Sans',monospace",fontSize:14,fontWeight:600,color:'#ffffff',marginBottom:4}},'Cài đặt'),
        h('label',null,'Nguồn dữ liệu',
          h('select',{value:dataSource,onChange:e=>this.setState({dataSource:e.target.value})},
            h('option',{value:'sim'},'Mô phỏng'),
            h('option',{value:'live'},'Live (SSE)')
          )
        ),
        isLive&&h('label',null,'Endpoint',
          h('input',{type:'text',value:endpoint,onChange:e=>this.setState({endpoint:e.target.value})})
        ),
        isSim&&h('label',null,'Số agent: '+agentCount,
          h('input',{type:'range',min:1,max:12,value:agentCount,onChange:e=>this.setState({agentCount:+e.target.value})})
        ),
        h('label',null,'Tốc độ: '+speed.toFixed(2)+'x',
          h('input',{type:'range',min:0.5,max:3,step:0.25,value:speed,onChange:e=>this.setState({speed:+e.target.value})})
        ),
        h('label',null,'Bubble text',
          h('input',{type:'checkbox',checked:showBubbles,onChange:e=>this.setState({showBubbles:e.target.checked})})
        ),
        isSim&&h('label',null,'Auto approve',
          h('input',{type:'checkbox',checked:autoApprove,onChange:e=>this.setState({autoApprove:e.target.checked})})
        )
      )
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(h(ClaudeOffice));
</script>
