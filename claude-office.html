      const sc=selIsland&&w.scenes.get(selIsland),meta=selIsland&&w.islands.find(i=>i.id===selIsland);
      const a=sc&&sel!=null&&sc.byId(sel);
      if(a){// Hub data has no names, prompts or folders: status, kind of work, room, and tool / model on "Cơ bản".
        const raw=sc.raw.get(a.sid)||{},Dp=sc.depts.get(a.dept),stx=ST[a.status]||ST.working,par=a.parent&&sc.byId(a.parent);
        return h('div',{style:PANEL},
          h('div',{style:{display:'flex',alignItems:'center',gap:10}},
            h('div',{style:{width:34,height:34,background:Dp?Dp.color:'#8b8fa3',color:'#ffffff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Pixelify Sans',monospace",fontSize:13,fontWeight:700,flex:'none'}},clip(a.short,4)),
            h('div',{style:{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:2}},h('div',{style:TITLE},clip(a.dept,40)),h('div',{style:MUTED},meta?clip(meta.name,40):'')),
            close),
          h('div',{style:{display:'flex',flexDirection:'column',gap:4,padding:10,background:'var(--bg)',borderLeft:'4px solid '+stx[1]}},h('span',{style:{fontWeight:600,color:stx[1]}},stx[0])),
          h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:'10px 14px'}},
            field('NHÓM VIỆC',KIND_LABEL.get(raw.kind)||'—'),
            field('PHÒNG BAN',clip(a.dept,40)),
            raw.tool?field('TOOL',clip(raw.tool,32)):null,
            raw.model?field('MODEL',clip(raw.model,48)):null,
            field('VAI TRÒ',par?'Sub-agent của '+par.short:'Main session')));
      }
      if(w.view==='all'&&sc&&meta){
        const head=h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          h('span',{style:{width:14,height:14,background:okColor(meta.color),flex:'none'}}),
          h('div',{style:{...TITLE,flex:1,minWidth:0}},meta.name||'Đảo'),close);
        // Owners may remove anyone's island but their own (the hub also refuses another owner's).
        const canRemove=w.me.role==='owner'&&meta.id!==w.me.islandId;
        const ask=canRemove&&w.confirm&&w.confirm.kind==='remove'&&w.confirm.id===meta.id?w.confirm:null;
        if(ask)return h('div',{style:PANEL},head,
          confirmRow('Xoá đảo này? Mọi máy của người đó bị thu hồi. Họ vẫn ghép lại được.','Xoá',ask,()=>this.removeIsland(meta.id),()=>{w.confirm=null;this.forceUpdate();}));
        const counts=new Map();for(const x of sc.agents)if(!x.leaving)counts.set(x.dept,(counts.get(x.dept)||0)+1);
        return h('div',{style:PANEL},head,
          h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:'10px 14px'}},
            field('TRẠNG THÁI',meta.online===false?'Offline':'Online'),
            field('MỨC CHIA SẺ',meta.private?'Riêng tư':SHARE_LABEL.get(meta.share)||'—'),
            field('SESSION',String(sc.raw.size))),
          meta.private?h('span',{style:{color:'var(--muted)'}},'Chủ đảo đang để riêng tư, không hiện nhân viên.'):
          h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
            h('span',{style:MUTED},'PHÒNG BAN'),
            counts.size?[...counts].map(([dk,n],i)=>{const Dp=sc.depts.get(dk);return h('div',{key:i,style:{display:'flex',alignItems:'center',gap:8}},
              h('span',{style:{width:8,height:8,background:Dp?Dp.color:'#8b8fa3',display:'inline-block',flex:'none'}}),
              h('span',{style:{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},dk),h('strong',{style:{color:'#ffffff'}},n));})
            :h('span',{style:{color:'var(--muted)'}},'Chưa có session nào.')),
          canRemove&&h('button',{className:'btn',onClick:()=>{w.confirm={kind:'remove',id:meta.id};this.forceUpdate();},
            style:{...SMALL_BTN,alignSelf:'flex-start',borderColor:'#e5484d',color:'#ff9b9e'}},'Xoá đảo'));
      }
      if(w.view!=='mine')return null;
      const fullLink=h('a',{href:'http://localhost:4317',target:'_blank',rel:'noopener noreferrer',style:LINK},'Mở bản đầy đủ trên máy này');
      const meLink=h('a',{href:'/me',style:LINK},'Quản lý máy ở trang Đảo của tôi');
      const leaveLink=h('a',{href:'/me/leave',style:LINK},'Rời hub');
      const isl=w.mine?w.mine.island:null;
      if(w.mine?!isl:!w.me.islandId){const origin=location.origin;
        return h('div',{style:PANEL},
          h('div',{style:TITLE},'Bạn chưa có đảo'),
          h('span',{style:{lineHeight:1.5}},'Ghép máy đang chạy Claude Code với thế giới:'),
          h('ol',{style:{margin:0,paddingLeft:18,display:'flex',flexDirection:'column',gap:6,lineHeight:1.5}},
            h('li',null,'Trên máy, trong thư mục plugin, chạy:',h('code',{style:{display:'block',marginTop:4,background:'var(--bg)',padding:'6px 8px',color:'#ffd166',fontSize:11,wordBreak:'break-all',userSelect:'all'}},'node server.js join '+origin)),
            h('li',null,'Terminal in một mã dạng XXXX-XXXX và một link. Mở link, đăng nhập bằng tài khoản này.'),
            h('li',null,'Gõ đúng mã thấy trên terminal rồi bấm Cho phép. Chỉ làm vậy nếu bạn vừa chạy lệnh trên máy của mình.'),
            h('li',null,'Giữ server chạy; đảo của bạn hiện ra sau vài giây.')),
          w.meErr&&h('span',{role:'alert',style:ERR},'Không tải được danh sách máy'),
          meLink,leaveLink);
      }
      const devs=w.mine?w.mine.devices:[],colors=w.mine?w.mine.colors:[],d=w.draft,sending=mine&&mine.online!==false;
      const asking=(x,where)=>{const c=w.confirm;return c&&c.kind==='revoke'&&c.id===x.id&&c.where===where?c:null;};
      const askRevoke=(x,where)=>h('button',{className:'btn',style:SMALL_BTN,onClick:()=>{w.confirm={kind:'revoke',id:x.id,where};this.forceUpdate();}},'Thu hồi');
      const revokeAsk=(x,c)=>confirmRow('Thu hồi '+(clip(x.name,40)||'máy này')+'?','Thu hồi',c,()=>this.revokeDevice(x.id),()=>{w.confirm=null;this.forceUpdate();});
      const edit=patch=>{const dr=w.draft;if(!dr)return;Object.assign(dr,patch,{dirty:true});w.saveMsg=null;this.forceUpdate();};
      return h('div',{style:PANEL},
        h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          h('span',{style:{width:14,height:14,background:okColor(mine?mine.color:isl&&isl.color),flex:'none'}}),
          h('div',{style:{...TITLE,flex:1,minWidth:0}},(mine?mine.name:isl&&isl.name)||'Đảo của tôi')),
        // A device paired in the last 7 days: say so, in case it was not this person.
        devs.filter(x=>x.isNew&&x.send!=='revoked').map(x=>{const c=asking(x,'new');
          return h('div',{key:'new-'+x.id,style:{display:'flex',flexDirection:'column',gap:6,padding:8,background:'var(--bg)',borderLeft:'4px solid #ffd166'}},
            h('div',{style:{display:'flex',alignItems:'center',gap:8}},
              h('span',{style:{flex:1,minWidth:0,lineHeight:1.4,overflowWrap:'anywhere'}},'Máy mới: '+(clip(x.name,40)||'—')+', lúc '+when(x.createdAt)),
              !c&&askRevoke(x,'new')),
            c&&revokeAsk(x,c));}),
        d&&h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
          h('span',{style:MUTED},'TÊN VÀ MÀU ĐẢO'),
          h('div',{style:{display:'flex',gap:6}},
            h('input',{type:'text','aria-label':'Tên đảo',maxLength:24,value:d.name,style:INPUT,
              onChange:e=>edit({name:e.target.value}),onKeyDown:e=>{if(e.key==='Enter')this.saveIsland();}}),
            h('button',{className:'btn',disabled:!!w.saving,style:SMALL_BTN,onClick:()=>this.saveIsland()},w.saving?'Đang lưu…':'Lưu')),
          colors.length>0&&h('div',{role:'group','aria-label':'Màu đảo',style:{display:'flex',flexWrap:'wrap',gap:6}},
            colors.map(c=>h('button',{key:c,type:'button',title:c,'aria-label':'Màu '+c,'aria-pressed':d.color===c,onClick:()=>edit({color:c}),
              style:{width:24,height:24,padding:0,cursor:'pointer',boxSizing:'border-box',background:c,border:d.color===c?'3px solid #ffffff':'2px solid var(--border)'}}))),
          w.saveMsg&&h('span',w.saveMsg.ok?{role:'status',style:{color:'#46a758'}}:{role:'alert',style:ERR},w.saveMsg.text)),
        h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
          h('span',{style:MUTED},'MÁY ĐÃ GHÉP'),
          !w.mine?(!w.meErr&&h('span',{style:{color:'var(--muted)'}},'Đang tải…')):
          devs.length?devs.map(x=>{const[lab,col]=SEND_LABEL.get(x.send)||['—','#8b8fa3'],revoked=x.send==='revoked',c=asking(x,'list');
            return h('div',{key:x.id,style:{display:'flex',flexDirection:'column',gap:6}},
              h('div',{style:{display:'flex',alignItems:'center',gap:8,opacity:revoked?0.6:1}},
                h('span',{style:{width:8,height:8,borderRadius:'50%',background:col,flex:'none'}}),
                h('div',{style:{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:1}},
                  h('span',{style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'#ffffff'}},clip(x.name,40)||'—'),
                  h('span',{style:MUTED},lab+(!revoked&&SHARE_LABEL.has(x.share)?' · mức '+SHARE_LABEL.get(x.share):''))),
                !revoked&&!c&&askRevoke(x,'list')),
              c&&revokeAsk(x,c));})
          :h('span',{style:{color:'var(--muted)'}},'Chưa có máy nào.'),
          w.meErr&&h('span',{role:'alert',style:ERR},'Không tải được danh sách máy')),
        !mine&&h('span',{style:{color:'var(--muted)',lineHeight:1.5}},'Chưa máy nào gửi trạng thái. Chạy server của plugin trên máy đã ghép.'),
        mine&&h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:'10px 14px'}},
          field('MỨC CHIA SẺ',SHARE_LABEL.get(mine.share)||'—'),
          field('RIÊNG TƯ',mine.private?'Có':'Không'),
          field('TRẠNG THÁI GỬI',sending?'Đang gửi':'Mất kết nối'),
          field('SESSION',String((w.scenes.get(mine.id)||{raw:new Map()}).raw.size))),
        h('span',{style:{color:'var(--muted)',lineHeight:1.5}},'Đây là bản đã lọc, đúng như người khác thấy. Tên session, câu lệnh và bong bóng chữ chỉ có trên máy của bạn.'),
        fullLink,meLink,leaveLink);
    },
    worldSettings(){
      const st=this.state;
      return h('div',{className:'settings-panel'},
        h('div',{style:{fontFamily:"'Pixelify Sans',monospace",fontSize:14,fontWeight:600,color:'#ffffff',marginBottom:4}},'Cài đặt'),
        h('label',null,'Tốc độ: '+st.speed.toFixed(2)+'x',h('input',{type:'range',min:0.5,max:3,step:0.25,value:st.speed,onChange:e=>this.setState({speed:+e.target.value})})),

            h('option',{value:'random'},'Ngẫu nhiên'),h('option',{value:'real'},'Thời tiết thật'),h('option',{value:'off'},'Tắt (luôn trời quang)'))),
        st.weatherMode==='real'&&h('div',{style:{display:'flex',gap:6}},

            onChange:e=>this.setState({cityDraft:e.target.value}),onKeyDown:e=>{if(e.key==='Enter')this.setWeather({city:st.cityDraft.trim()});}}),
          h('button',{className:'btn',style:{padding:'4px 8px',fontSize:11},onClick:()=>this.setWeather({city:st.cityDraft.trim()})},'Cập nhật')),

          WEATHER_PREVIEW.map(([type,label])=>h('button',{key:type,className:'btn',title:'Xem thử: '+WEATHER_LABEL[type],style:{padding:'3px 7px',fontSize:11},onClick:()=>this.previewWeather(type)},label))));
